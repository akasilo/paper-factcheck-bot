name: draft-post

# 매일 저녁 8시(KST): 논문 검색 → Gemini 원고 초안 → 카드 렌더 → queue/<내일>.json 커밋 → 승인 이슈 열기
on:
  schedule:
    - cron: "0 11 * * *"   # 20:00 KST
  workflow_dispatch:
    inputs:
      date:
        description: "큐 날짜 (YYYY-MM-DD). 비우면 내일(KST)"
        required: false
        default: ""
      topic:
        description: "특정 주제 id (data/topics.json). 비우면 자동 선택"
        required: false
        default: ""
      force:
        description: "같은 날짜 큐가 있어도 다시 만들기"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: draft-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      # 원고 작성 LLM: 기본은 GitHub Models(무료). 저장소 Variables 로 바꿀 수 있음.
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'github' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji fonts-noto-cjk >/dev/null

      - name: Decide date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -d tomorrow +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Find paper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="--topic ${{ github.event.inputs.topic }}"; fi
          python bot/find_papers.py --out /tmp/candidate.json $ARGS

      - name: Draft with LLM
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python bot/draft_post.py --date "${{ steps.d.outputs.date }}" --candidate /tmp/candidate.json $ARGS

      - name: Render cards
        run: python bot/render_cards.py --date "${{ steps.d.outputs.date }}"

      - name: Commit draft
        run: |
          git config user.name "paper-factcheck-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A queue images data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "draft: ${{ steps.d.outputs.date }} [skip ci]"
            git push
          fi

      - name: Open approval issue
        run: python bot/open_issue.py --date "${{ steps.d.outputs.date }}"
