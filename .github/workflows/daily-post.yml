name: daily-post

# GitHub 예약 실행은 뜨는 시각이 들쭉날쭉하고, 상당수는 아예 안 뜬다.
# 실제로 관찰한 것 (9/10~9/12, 하루 10번 걸어둔 것 중 실제로 뜬 건 2~3번):
#     07:08 예약 → 07:27 에 뜸 (사흘 내리)   09:08 → 09:30 쯤   09:38 → 13:33 에 뜬 날도 있음
# 그래서 하루 종일 30분마다 깨우고, 실제 게시는 bot/gate.py 가 **슬롯당 한 번**으로 묶는다.
#
# 슬롯(아침·점심·퇴근길)은 아래 SLOTS 한 줄로 정한다. 문지기는 깨어난 *시각*을 보고
# 지금이 어느 슬롯인지 스스로 정하므로, 아침 예약이 밀려 점심때 떠도 점심 몫으로 쓰인다.
# 이 구조 덕에 9/11 에 09:29 실행이 시트 오류로 실패했을 때 13:32 실행이 대신 올렸다.
#
# 게시 시각을 바꾸려면 SLOTS 만 고치면 된다. cron 은 '깨우는 창'일 뿐이다.
on:
  schedule:
    - cron: "8,38 22-23 * * *"   # 07:08 ~ 08:38 KST
    - cron: "8,38 0-14 * * *"    # 09:08 ~ 23:38 KST
  workflow_dispatch:
    inputs:
      date:
        description: "게시할 큐 날짜 (YYYY-MM-DD). 비우면 오늘(KST)"
        required: false
        default: ""
      target:
        description: "어디에 올릴지"
        type: choice
        options: [both, instagram, threads]
        default: both
      dry_run:
        description: "검증만 하고 실제로 올리지 않기"
        type: boolean
        default: false
      again:
        description: "그 슬롯을 이미 채웠어도 한 번 더 올리기 (잠금 해제)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

env:
  # 하루 세 번 — 각 시각(KST) 이후 처음 깨어난 실행이 그 슬롯 몫을 올린다.
  # 07:00 인 이유: 사흘 내리 실제로 뜬 건 07:27 실행뿐이었다. 08:00 으로 두면 막혀서 09:30 까지 밀린다.
  SLOTS: "morning=07:00,lunch=12:00,evening=18:00"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      # 이미지 공개 URL 기준 경로. 저장소가 public 이면 raw URL 로 바로 쓸 수 있다.
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/
      SHEET_URL: ${{ secrets.SHEET_URL }}
      SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓰므로 pip install 전에 돌린다.
      # 예약 실행은 하루 10번 깨어나지만 9번은 여기서 15초 만에 끝난다.
      - name: 지금 올릴 슬롯이 있는지 확인
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python bot/gate.py --slots "$SLOTS" | tee -a "$GITHUB_OUTPUT"
          else
            echo "go=yes" | tee -a "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "reason=수동 실행"
          fi

      - name: Install deps
        if: steps.gate.outputs.go == 'yes'
        run: pip install -r requirements.txt

      # 시트에 채워둔 쿠팡 링크를 큐에 반영한다 (링크 → 승인 / 'skip' → 건너뜀)
      - name: Pull links from sheet
        if: steps.gate.outputs.go == 'yes'
        run: python bot/sheet_sync.py --pull

      - name: Publish
        if: steps.gate.outputs.go == 'yes'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ -n "${{ github.event.inputs.target }}" ]; then ARGS="$ARGS --target ${{ github.event.inputs.target }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.again }}" = "true" ]; then ARGS="$ARGS --again"; fi
          if [ -n "${{ steps.gate.outputs.slot }}" ]; then ARGS="$ARGS --slot ${{ steps.gate.outputs.slot }}"; fi
          python bot/publish.py --slots "$SLOTS" $ARGS

      - name: Commit results
        if: always() && steps.gate.outputs.go == 'yes'
        run: |
          bash bot/commit_push.sh "post: $(date +%Y-%m-%d) [skip ci]" queue posted skipped

      # 게시완료 / 건너뜀 을 시트 '상태' 칸에 반영
      - name: Write status back to sheet
        if: always() && steps.gate.outputs.go == 'yes'
        run: python bot/sheet_sync.py --status
