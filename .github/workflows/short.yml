name: short

# 카드뉴스 한 건을 세로 숏폼(1080x1920, TTS 낭독)으로 만들어 images/<id>/short.mp4 에 커밋한다.
#  - Actions 탭에서 큐 id 를 넣어 수동 실행 (이미 게시돼 큐에서 지워진 글도 posted/ 기록으로 만든다)
#  - 소리: 기본 Gemini 3.8 Flash TTS (secrets.GEMINI_API_KEY). Variables SHORT_TTS=google 이면 Cloud TTS. 둘 다 없으면 무음
#  - 목소리 바꾸기: 저장소 Variables 에 GEMINI_TTS_VOICE (예: Leda) / GEMINI_TTS_STYLE (말투 지시문)
#  - 목소리 비교용: 아래 voice / style 입력을 채우면 그 실행에서만 그 값을 쓴다 (Variables 보다 우선)
on:
  workflow_dispatch:
    inputs:
      id:
        description: "큐 id (예: 2046-energy_drink)"
        required: true
      force:
        description: "이미 있어도 다시 만들기 (TTS 도 다시 → 글자 수 소모)"
        type: boolean
        default: false
      voice:
        description: "(선택) 이번만 쓸 Gemini 목소리 (예: Kore, Leda, Zephyr, Charon)"
        required: false
        default: ""
      style:
        description: "(선택) 이번만 쓸 말투 지시문"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: short
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      SHORT_TTS: ${{ vars.SHORT_TTS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ github.event.inputs.voice || vars.GEMINI_TTS_VOICE }}
      GEMINI_TTS_STYLE: ${{ github.event.inputs.style || vars.GEMINI_TTS_STYLE }}
      GEMINI_TTS_RATE: ${{ vars.GEMINI_TTS_RATE }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
      GOOGLE_TTS_RATE: ${{ vars.GOOGLE_TTS_RATE }}
      # 배경음 (assets/music). SHORT_MUSIC=off 로 끄고, SHORT_MUSIC_VOLUME(0~1, 기본 0.35) 로 음량 조절
      SHORT_MUSIC: ${{ vars.SHORT_MUSIC }}
      SHORT_MUSIC_VOLUME: ${{ vars.SHORT_MUSIC_VOLUME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install requests
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -q >/dev/null
            sudo apt-get install -y -q ffmpeg >/dev/null
          fi
          ffmpeg -version | head -1

      - name: Build short
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python bot/make_short.py --id "${{ github.event.inputs.id }}" --force
          else
            python bot/make_short.py --id "${{ github.event.inputs.id }}"
          fi

      - name: Commit video
        run: |
          bash bot/commit_push.sh "short: ${{ github.event.inputs.id }} [skip ci]" images
