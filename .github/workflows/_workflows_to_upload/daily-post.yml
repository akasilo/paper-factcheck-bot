name: daily-post

# GitHub 의 예약 실행은 뜨는 시각이 들쭉날쭉하다 (07:37 로 걸어도 09:30 에 뜬 날이 이틀 연속 있었다).
# 그래서 아침 시간대에 30분마다 여러 번 깨우고, 실제 게시는 bot/gate.py 가 하루 한 번으로 묶는다.
#   - POST_AFTER (KST) 이전이면 그냥 종료
#   - 오늘 이미 올렸으면 그냥 종료
# 게시 시각을 바꾸려면 아래 POST_AFTER 만 고치면 된다. cron 은 '깨우는 창'일 뿐이다.
on:
  schedule:
    - cron: "8,38 20-23 * * *"   # 05:08 ~ 08:38 KST 사이 30분 간격
    - cron: "8,38 0 * * *"       # 09:08, 09:38 KST — 많이 밀린 날의 마지막 기회
  workflow_dispatch:
    inputs:
      date:
        description: "게시할 큐 날짜 (YYYY-MM-DD). 비우면 오늘(KST)"
        required: false
        default: ""
      target:
        description: "어디에 올릴지"
        type: choice
        options: [both, instagram, threads]
        default: both
      dry_run:
        description: "검증만 하고 실제로 올리지 않기"
        type: boolean
        default: false
      again:
        description: "오늘 이미 올렸어도 한 번 더 올리기 (하루 1회 잠금 해제)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

env:
  # 이 시각(KST) 이후에 처음 깨어난 실행이 그날의 게시를 담당한다.
  POST_AFTER: "08:00"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      # 이미지 공개 URL 기준 경로. 저장소가 public 이면 raw URL 로 바로 쓸 수 있다.
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/
      SHEET_URL: ${{ secrets.SHEET_URL }}
      SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓰므로 pip install 전에 돌린다.
      # 예약 실행은 하루 10번 깨어나지만 9번은 여기서 15초 만에 끝난다.
      - name: 오늘 올릴 차례인지 확인
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python bot/gate.py --after "$POST_AFTER" | tee -a "$GITHUB_OUTPUT"
          else
            echo "go=yes" | tee -a "$GITHUB_OUTPUT"
            echo "reason=수동 실행"
          fi

      - name: Install deps
        if: steps.gate.outputs.go == 'yes'
        run: pip install -r requirements.txt

      # 시트에 채워둔 쿠팡 링크를 큐에 반영한다 (링크 → 승인 / 'skip' → 건너뜀)
      - name: Pull links from sheet
        if: steps.gate.outputs.go == 'yes'
        run: python bot/sheet_sync.py --pull

      - name: Publish
        if: steps.gate.outputs.go == 'yes'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ -n "${{ github.event.inputs.target }}" ]; then ARGS="$ARGS --target ${{ github.event.inputs.target }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.again }}" = "true" ]; then ARGS="$ARGS --again"; fi
          python bot/publish.py $ARGS

      - name: Commit results
        if: always() && steps.gate.outputs.go == 'yes'
        run: |
          bash bot/commit_push.sh "post: $(date +%Y-%m-%d) [skip ci]" queue posted skipped

      # 게시완료 / 건너뜀 을 시트 '상태' 칸에 반영
      - name: Write status back to sheet
        if: always() && steps.gate.outputs.go == 'yes'
        run: python bot/sheet_sync.py --status
